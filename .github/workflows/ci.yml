name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # devDependencies (semantic-release/tar/brace-expansion chain) are
      # excluded — those never ship in the published package. Blocking here
      # because this package's production dependencies are clean today.
      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # vitest's own toolchain (via rolldown) requires node:util's
      # styleText export, unsupported on Node 18.20.8 — a limitation of the
      # test runner itself, not of dist/cli.js (verified separately below on
      # every matrix version, including 18.x).
      - name: Test
        if: matrix.node-version != '18.x'
        run: npm test

      - name: Smoke-test the built CLI binary
        run: node dist/cli.js 2>&1 | grep -q "Either --spec <path> or --url <url> is required."
